name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Check tag, version, branch and notes
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(ruby -r ./lib/skill/version -e 'puts Skill::VERSION')
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag $RELEASE_TAG does not match gem version $version." >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
          prerelease=$(ruby -rrubygems/version -e 'puts Gem::Version.new(ARGV.fetch(0)).prerelease?' "$version")
          if [ "$prerelease" != "$RELEASE_PRERELEASE" ]; then
            echo "The GitHub prerelease setting does not match gem version $version." >&2
            exit 1
          fi
          notes="packaging/release-notes/v$version.md"
          if [ ! -s "$notes" ]; then
            echo "$notes is missing or empty." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Use the committed release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release edit "$RELEASE_TAG" --notes-file "packaging/release-notes/v$VERSION.md"

  test:
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build gem
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: gem build skill.gemspec --output "skill-${{ needs.validate.outputs.version }}.gem"
      - uses: actions/upload-artifact@v4
        with:
          name: gem
          path: skill-${{ needs.validate.outputs.version }}.gem
          if-no-files-found: error

  publish:
    name: Publish to RubyGems
    needs: [validate, test, build]
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - uses: actions/download-artifact@v4
        with:
          name: gem
          path: pkg
      - name: Push gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GEM_HOST_API_KEY" ]; then
            echo "RUBYGEMS_AUTH_TOKEN is not configured." >&2
            exit 1
          fi
          output=$(gem push --host https://rubygems.org "pkg/skill-${{ needs.validate.outputs.version }}.gem" 2>&1) || {
            echo "$output"
            if echo "$output" | grep -qi "Repushing of gem versions is not allowed"; then
              exit 0
            fi
            exit 1
          }
          echo "$output"
